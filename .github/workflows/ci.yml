on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Alineado con "engines.node": ">=24.0.0" de package.json;
          # isolated-vm@7 (sandbox de plugins) exige Node >= 24.
          node-version: "24"
      - name: Instalar dependencias
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build del sitio
        run: npm run build
      - name: Validar manifiestos de plugins
        run: npx tsx scripts/validate-manifests.ts
