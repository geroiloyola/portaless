on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Instalar dependencias
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build del sitio
        run: npm run build
      - name: Validar manifiestos de plugins
        run: npx tsx scripts/validate-manifests.ts
