# Regenera package-lock.json y lo commitea en la rama donde corre.
#
# Existe porque package.json se edito via API (sin poder correr npm) y el
# lockfile quedo desincronizado: faltan better-sqlite3, vitest, tsx,
# web-bot-auth y esbuild 0.28 -> `npm ci` falla para cualquiera.
#
# Triggers:
#   - push a las ramas de trabajo cuando cambia package.json o este archivo.
#     (GitHub solo muestra el boton "Run workflow" de workflow_dispatch si
#     el workflow existe en la rama por defecto, main; por eso el trigger
#     por push es el que realmente se usa mientras esto no este en main.)
#   - workflow_dispatch, para cuando este archivo llegue a main.
#
# Nunca corre en main. Solo toca package-lock.json. Los commits hechos con
# GITHUB_TOKEN no disparan otros workflows, asi que no hay bucle; despues de
# que commitee, el siguiente push normal vuelve a correr "Unit Tests".

name: Regenerate lockfile

on:
  push:
    branches: [agentic, deploy-manifest, wizard-intent]
    paths:
      - package.json
      - .github/workflows/regen-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regen-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regen:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerar package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Validar que npm ci ahora funciona
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commitear si cambio
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json ya estaba sincronizado, nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerar package-lock.json (sincronizar con package.json)"
          git push
