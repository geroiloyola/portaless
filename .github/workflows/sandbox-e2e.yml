name: Sandbox E2E Tests

on:
  push:
    branches: [main, agentic]
  pull_request:
    branches: [main]

jobs:
  sandbox-e2e:
    name: Sandbox hello-plugin E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (version soportada por el runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Run sandbox E2E tests
        run: npx vitest run tests/e2e/sandbox-hello-plugin.test.ts --reporter=verbose

  admin-role-check:
    name: Admin role-check unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (version soportada)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Run admin role-check unit test
        run: npx vitest run tests/unit/admin-pages-role-check.test.ts --reporter=verbose
