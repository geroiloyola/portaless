# Configuracion opcional para desplegar en Cloudflare Pages via Wrangler CLI.
# No es necesaria si conectas el repositorio directamente desde el dashboard
# de Cloudflare Pages.

name = "portaless"
pages_build_output_dir = "dist"
compatibility_date = "2026-01-01"

